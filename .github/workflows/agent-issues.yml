name: Issue Agent — gitclaw-style

# gitclaw-style issue-driven agent (modeled on SawyerHood/gitclaw):
#   - opening an issue starts an agent run
#   - commenting on the issue resumes the SAME session (memory lives in
#     state/issues/<N>.json committed to git)
#   - the agent works on branch agent/issue-<N> → opens a PR
#   - replies as an issue comment with a summary + PR link
#   - runner is pluggable via repo variable AGENT_BATCH_RUNNER:
#     opencode (default) | claude-code | codex
#   - optionally logs the run to the Hermes project-manager panel via the
#     PM_PANEL_URL secret (skipped silently when unset)
# Security: only repo OWNER / MEMBER / COLLABORATOR can trigger (same as
# gitclaw); bot comments never trigger. For private repos no extra exposure.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (
        github.event_name == 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure opencode → kilo free (keyless, direct)
        # Zero local/VPS infra: the runner talks straight to api.kilo.ai.
        # Free tier is keyless (200 req/h per egress IP); GH runner IPs
        # rotate, so every run gets a fresh bucket. Set the model via the
        # AGENT_BATCH_MODEL repo variable, e.g. kilo/poolside/laguna-s-2.1:free
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "provider": {
              "kilo": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Kilo Free (direct, keyless)",
                "options": {"baseURL": "https://api.kilo.ai/api/gateway/v1"},
                "models": {
                  "poolside/laguna-s-2.1:free": {"name": "Laguna S 2.1 (free)"},
                  "stepfun/step-3.7-flash:free": {"name": "Stepfun 3.7 Flash (free)"},
                  "tencent/hy3:free": {"name": "Tencent Hy3 (free)"},
                  "kilo-auto/free": {"name": "Kilo Auto Free"}
                }
              }
            }
          }
          EOF

      - name: Run agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RUNNER: ${{ vars.AGENT_BATCH_RUNNER }}
          MODEL: ${{ vars.AGENT_BATCH_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PM_PANEL_URL: ${{ secrets.PM_PANEL_URL }}
        run: python3 lifecycle/agent.py
        timeout-minutes: 40
