name: Agent Batch — parallel AI tasks

# ایده: یه لیست تسک می‌دی → هر تسک یه ایجنت مستقل opencode می‌گیره،
# هر کدوم روی یه branch جدا کار می‌کنه و آخرش PR باز می‌کنه.
# matrix باعث میشه ۱۰-۲۰ تسک همزمان اجرا بشن.
#
# فقط یک secret لازمه: OPENCODE_API_KEY (key از zen relay — مجانی)
# مدل‌های free: opencode/mimo-v2.5-free, opencode/deepseek-v4-flash-free, ...

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: |
          Tasks — one per line. Example:
          update README with API docs
          add tests for the auth module
          fix the flaky e2e test
        required: true
        type: string
      model:
        description: Model (provider/model)
        required: false
        default: "opencode/mimo-v2.5-free"
        type: string
      base_branch:
        description: Branch to fork from
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # Split the task list into one matrix entry per task → parallel jobs.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix from task list
        id: build
        run: |
          TASKS="${{ github.event.inputs.tasks }}"
          python3 - "$TASKS" <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, sys, hashlib
          raw = sys.argv[1]
          tasks = [t.strip() for t in raw.splitlines() if t.strip() and not t.strip().startswith('#')]
          arr = []
          for i, t in enumerate(tasks, 1):
              h = hashlib.md5(t.encode()).hexdigest()[:6]
              arr.append({"task": t, "idx": str(i), "branch": f"agent-{i:02d}-{h}"})
          print(f"matrix={json.dumps(arr)}")
          PYEOF

  agent:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch }}
          fetch-depth: 0

      - name: Create working branch
        run: |
          git checkout -b ${{ matrix.branch }}
          git push -u origin ${{ matrix.branch }} 2>/dev/null || true

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          # PATH is exported for the NEXT step; verify with the full path here
          "$HOME/.opencode/bin/opencode" --version

      - name: Run agent on task
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          opencode run --model ${{ github.event.inputs.model }} \
            "${{ matrix.task }}"
        timeout-minutes: 25

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced — skipping commit."
            exit 0
          fi
          git commit -m "agent: ${{ matrix.task }}"
          git push origin ${{ matrix.branch }}
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.commit.outputs.committed == 'true'
        env:
          # github.token can't create PRs ("Actions is not permitted");
          # use a PAT with repo+workflow scopes instead.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh pr create \
            --base ${{ github.event.inputs.base_branch }} \
            --head ${{ matrix.branch }} \
            --title "🤖 Agent [${{ matrix.idx }}]: ${{ matrix.task }}" \
            --body "Auto-generated by the Agent Batch workflow." || true
