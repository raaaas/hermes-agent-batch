name: Agent Batch — parallel AI tasks

# لیست تسک می‌گیری → هر تسک یه ایجنت مستقل opencode می‌گیره،
# هر کدوم روی یه branch جدا کار می‌کنه و آخرش PR باز می‌کنه.
# matrix یعنی همه همزمان. Context (فایل CONTEXT.md روی branch) به هر
# ایجنت داده می‌شه تا حافظه‌ی پروژه رو داشته باشه.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Tasks, one per line'
        required: true
        type: string
      context:
        description: 'Project context / memory for agents (optional)'
        required: false
        default: ''
        type: string
      model:
        description: 'Model (provider/model)'
        required: false
        default: 'kilo/stepfun/step-3.7-flash:free'
        type: string
      base_branch:
        description: 'Branch to fork from'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix
        id: build
        run: |
          TASKS="${{ github.event.inputs.tasks }}"
          CTX="${{ github.event.inputs.context }}"
          python3 - "$TASKS" "$CTX" <<'PYEOF' > /tmp/matrix.json
          import json, sys, hashlib
          raw, ctx = sys.argv[1], sys.argv[2]
          tasks = [t.strip() for t in raw.splitlines() if t.strip() and not t.strip().startswith('#')]
          arr = []
          for i, t in enumerate(tasks, 1):
              h = hashlib.md5(t.encode()).hexdigest()[:6]
              arr.append({"task": t, "idx": str(i), "branch": f"agent-{i:02d}-{h}", "context": ctx})
          print(json.dumps(arr))
          PYEOF
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json

  agent:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch }}
          fetch-depth: 0

      - name: Create branch
        run: |
          git checkout -b ${{ matrix.branch }}
          git push -u origin ${{ matrix.branch }} 2>/dev/null || true

      - name: Write context file
        if: matrix.context != ''
        run: |
          cat > CONTEXT.md <<'EOF'
          ${{ matrix.context }}
          EOF
          git add CONTEXT.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: add agent context" 2>/dev/null || true
          git push origin ${{ matrix.branch }} 2>/dev/null || true

      - name: Install opencode
        run: |
          npm install -g opencode-ai@1.18.12
          opencode --version

      - name: Configure opencode → kilo free (direct, keyless)
        # Brain = kilo free tier, DIRECT api.kilo.ai — no relay, no VPS, no
        # local infra in the path. Keyless: 200 req/h per egress IP.
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {
            "provider": {
              "kilo": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Kilo Free (direct, keyless)",
                "options": {"baseURL": "https://api.kilo.ai/api/gateway/v1"},
                "models": {
                  "poolside/laguna-s-2.1:free": {"name": "Laguna S 2.1 (free)"},
                  "stepfun/step-3.7-flash:free": {"name": "Stepfun 3.7 Flash (free)"},
                  "tencent/hy3:free": {"name": "Tencent Hy3 (free)"},
                  "kilo-auto/free": {"name": "Kilo Auto Free"}
                }
              }
            }
          }
          EOF

      - name: Run agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          opencode run --auto --model ${{ github.event.inputs.model }} \
            "${{ matrix.task }}"
        timeout-minutes: 110

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git commit -m "agent: ${{ matrix.task }}"
          git push origin ${{ matrix.branch }}
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          gh pr create \
            --base ${{ github.event.inputs.base_branch }} \
            --head ${{ matrix.branch }} \
            --title "🤖 Agent [${{ matrix.idx }}]: ${{ matrix.task }}" \
            --body "Auto-generated by the Agent Batch workflow." || true
