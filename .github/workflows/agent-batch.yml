name: Agent Batch — parallel AI tasks

# لیست تسک می‌گیری → هر تسک یه ایجنت مستقل با CLI دلخواه (runner) می‌گیره،
# هر کدوم روی یه branch جدا کار می‌کنه و آخرش PR باز می‌کنه.
# Runner دلخواه از dropdown: cline (پیش‌فرض) | opencode | kilo | claude-code | codex | dsh
# — هم مدل رایگان، هم بیار کلید خودت (BYOK) رو انتخاب کن.
# matrix یعنی همه همزمان. Context (فایل CONTEXT.md روی branch) به هر
# ایجنت داده می‌شه تا حافظه‌ی پروژه رو داشته باشه.

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Tasks, one per line'
        required: true
        type: string
      runner:
        description: 'Coding agent CLI'
        required: false
        default: 'cline'
        type: choice
        options: [cline, opencode, kilo, claude-code, codex, dsh]
      provider:
        description: 'BYOK provider id for cline (openrouter/anthropic/openai/…, empty = default)'
        required: false
        default: ''
        type: string
      model:
        description: 'Model (provider/model; empty = runner default)'
        required: false
        default: ''
        type: string
      context:
        description: 'Project context / memory for agents (optional)'
        required: false
        default: ''
        type: string
      base_branch:
        description: 'Branch to fork from'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build matrix
        id: build
        env:
          AGENT_BATCH_TASKS: ${{ github.event.inputs.tasks }}
          AGENT_BATCH_CONTEXT: ${{ github.event.inputs.context }}
        run: |
          python3 - <<'PYEOF' > /tmp/matrix.json
          import json, os, hashlib
          raw = os.environ.get("AGENT_BATCH_TASKS", "")
          ctx = os.environ.get("AGENT_BATCH_CONTEXT", "")
          tasks = [t.strip() for t in raw.splitlines() if t.strip() and not t.strip().startswith('#')]
          arr = []
          for i, t in enumerate(tasks, 1):
              h = hashlib.md5(t.encode()).hexdigest()[:6]
              arr.append({"task": t, "idx": str(i), "branch": f"agent-{i:02d}-{h}", "context": ctx})
          print(json.dumps(arr))
          PYEOF
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json

  agent:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch }}
          fetch-depth: 0

      - name: Create branch
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH" 2>/dev/null || true

      - name: Write context file
        if: matrix.context != ''
        env:
          BRANCH: ${{ matrix.branch }}
          AGENT_BATCH_CONTEXT: ${{ matrix.context }}
        run: |
          printf '%s\n' "$AGENT_BATCH_CONTEXT" > CONTEXT.md
          git add CONTEXT.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: add agent context" 2>/dev/null || true
          git push origin "$BRANCH" 2>/dev/null || true

      - name: Install runner CLI
        env:
          RUNNER: ${{ github.event.inputs.runner }}
        run: |
          case "$RUNNER" in
            cline)        pkg=cline ;;
            opencode)     pkg=opencode-ai@1.18.12 ;;
            kilo)         pkg=@kilocode/cli ;;
            claude-code)  pkg=@anthropic-ai/claude-code ;;
            codex)        pkg=@openai/codex ;;
            dsh)          pkg=@deepseek-ai/dsh ;;
            *)            echo "unknown runner $RUNNER"; exit 1 ;;
          esac
          npm install -g "$pkg"

      - name: Run agent
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          RUNNER: ${{ github.event.inputs.runner }}
          TASK: ${{ matrix.task }}
          MODEL: ${{ github.event.inputs.model }}
          PROVIDER: ${{ github.event.inputs.provider }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: |
          case "$RUNNER" in
            cline)
              ARGS=(--auto-approve true)
              [ -n "$PROVIDER" ] && ARGS+=(--provider "$PROVIDER")
              [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
              cline "${ARGS[@]}" --timeout 5400 "$TASK" ;;
            opencode)
              ARGS=(run --auto --print-logs)
              [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
              opencode "${ARGS[@]}" "$TASK" ;;
            kilo)
              ARGS=(run --auto --print-logs)
              [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
              kilo "${ARGS[@]}" "$TASK" ;;
            claude-code)
              ARGS=(-p "$TASK" --output-format text --dangerously-skip-permissions)
              [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
              claude "${ARGS[@]}" ;;
            codex)
              ARGS=(exec --full-auto "$TASK")
              [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
              codex "${ARGS[@]}" ;;
            dsh)
              dsh --profile headless "$TASK" ;;
          esac
        timeout-minutes: 110

      - name: Commit and push
        id: commit
        env:
          BRANCH: ${{ matrix.branch }}
          RUNNER: ${{ github.event.inputs.runner }}
          TASK: ${{ matrix.task }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git commit -m "agent ($RUNNER): $TASK"
          git push origin "$BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch }}
          BRANCH: ${{ matrix.branch }}
          IDX: ${{ matrix.idx }}
          RUNNER: ${{ github.event.inputs.runner }}
          TASK: ${{ matrix.task }}
        run: |
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "🤖 Agent [$IDX] ($RUNNER): $TASK" \
            --body "Auto-generated by the Agent Batch workflow — runner: \`$RUNNER\`." || true
